# nlma.io — SEO/perf hardening (issue #6). Three independent pieces; paste each where noted
# into /etc/nginx/sites-available/nlma.io. `nginx -t && systemctl reload nginx` after.

# ---------------------------------------------------------------------------
# 1) Canonicalize *.html requests to their extensionless URL.
#    Every internal link on the site already uses extensionless paths (see sitemap.xml),
#    so this only catches external/legacy links and crawlers hitting the .html twin.
#    Paste at the top of the `server { }` block (server context, above all `location`s) —
#    `rewrite ... permanent` returns the 301 immediately and never reaches location matching,
#    so this runs before (and does not conflict with) the `/consults` and `/referrals`
#    exact-match locations below.
#    The index.html case is special-cased first: naively stripping ".html" from
#    "index.html" would 301 to "/index" (a non-canonical URL that still 200s via
#    try_files), creating a *new* duplicate-content pair instead of closing the old one.
rewrite ^/(.*)index\.html$ /$1 permanent;
rewrite ^/(.+)\.html$ /$1 permanent;

# ---------------------------------------------------------------------------
# 2) HSTS: add includeSubDomains + preload to the existing header.
#    Find the current line (reads `add_header Strict-Transport-Security "max-age=31536000" always;`
#    or similar) in the server block and REPLACE it with this one — don't add a second copy.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ---------------------------------------------------------------------------
# 3) Cache-Control: short-but-nonzero for HTML, long+immutable for static assets.
#
# 3a) Paste this one line in the server block alongside the other `add_header`s (HSTS,
#     CSP, X-Frame-Options, etc. — see above). It's inherited by every location that
#     doesn't declare its own `add_header` array, which covers /, /consults, /referrals,
#     and every other page.
add_header Cache-Control "public, max-age=300, must-revalidate" always;
#
# 3b) Static assets get a long-lived cache instead. IMPORTANT nginx gotcha: `add_header`
#     is an array directive that does NOT inherit into a location that sets its own
#     `add_header` — so this location must repeat every server-level add_header (HSTS,
#     nosniff, frame-options, referrer-policy, CSP, permissions-policy) or those responses
#     will silently lose them. The values below are transcribed from the current live
#     headers (checked via `curl -sI`); keep them in sync if the server-level ones change.
#     Paste this location block before `location / {`.
location ~* \.(?:png|jpg|jpeg|svg|ico|webp|avif|woff2?|pdf)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://n8n.nlma.io; form-action 'self' https://checkout.stripe.com; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
}
